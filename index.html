<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choix des sweats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>Choix des sweats</h1>
  </header>

  <main>
    <section class="product-filter" aria-labelledby="productFilterTitle">
      <h2 id="productFilterTitle">Filtrer le catalogue</h2>
      <label for="productSelect">
        Type de sweat
        <select id="productSelect"></select>
      </label>
    </section>

    <div id="app"></div>
  </main>

  <dialog id="preview">
    <button id="closePreview" aria-label="Fermer">×</button>
    <img id="previewImage" alt="">
    <p id="previewTitle"></p>
  </dialog>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
